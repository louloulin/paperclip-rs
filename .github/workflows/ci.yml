name: CI

# plan1 §5 W0② / §6.2 / §6.4 — 「每切片必须全绿」的机器化。
#
# 这里**不重写**任何门禁命令：每条 `run:` 都调用 `scripts/gates.sh --only <gate>`，
# 门禁命令的唯一实现在 `scripts/gates.sh`，本地 `bash scripts/gates.sh` 与 CI 跑的是
# 逐字同一批命令（避免「CI 绿、本地红」式的两处漂移）。
# 门 ↔ job 对应表、期望数字、例外说明见 `docs/24-W0-CI.md`。

on:
  push:
    branches:
      - main
      - feat/multica-rs-initial
  pull_request:
    branches:
      - main
      - feat/multica-rs-initial
  workflow_dispatch:

# 同一分支的旧跑一律取消：push 风暴下不要排队烧额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 本仓 .cargo/config.toml 开了 `[build] incremental = true`；CI 上关掉它：
  # 增量编译会复用已编译产物、可能不重复发出 warning，而 ③ 是 `-D warnings` 门禁，
  # 每次都从干净状态编译才是可复现的那个信号（也让 rust-cache 的文件集更稳定）。
  CARGO_INCREMENTAL: "0"

jobs:
  # ①–⑤ + ⑩：不需要数据库，每次 push 都跑。
  fast:
    name: fast — fmt / build / clippy / test / file-size / scripts-tests / section-alloc
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 只声明 `channel = "stable"`；rustfmt/clippy 必须显式带上，
      # 否则 runner 上可能缺失组件（本仓 rust-toolchain.toml 也声明了这两个 component，
      # 这里再显式声明一次是冗余保险，不是依赖）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: "① fmt — cargo fmt --all --check"
        run: bash scripts/gates.sh --only fmt

      - name: "② build — cargo build --workspace --all-targets --locked"
        run: bash scripts/gates.sh --only build

      - name: "③ clippy — cargo clippy --workspace --all-targets -- -D warnings"
        run: bash scripts/gates.sh --only clippy

      # ③ 与 ④ 不可合并：只有 ④ 会检查 `crates/mc-http/tests/*` 的 DB e2e 代码。
      - name: "④ clippy (mc-http/test-util) — 覆盖 tests/* 的 DB e2e"
        run: bash scripts/gates.sh --only clippy-test-util

      # ⑤ 由 gates.sh 用 `env -u MULTICA_TEST_DATABASE_URL` 显式剥掉库变量：
      # 带上它会让 mc-http 的 `smoke` 集成测试对同一个库重跑迁移 → `relation "user" already exists`。
      - name: "⑤ test — cargo test --workspace（不带 DB 变量）"
        run: bash scripts/gates.sh --only test

      # ⑩ 纯 Python + `git ls-files`，亚秒级：R7 的「单文件 800 行硬上限」。它只读工作区，
      # 不编译、不需要数据库，所以放在 ①–⑤ 之后（不是新 job，也不引新 action）。
      # 存量违规钉在 `scripts/file_size_baseline.tsv`（只减不增）；刷新用 `--write-baseline`。
      - name: "⑩ file-size — python3 scripts/file_size_check.py --quiet"
        run: bash scripts/gates.sh --only file-size

      # ⑫ 纯标准库 unittest、亚秒级、不需要数据库/编译。存在的理由：两个 `scripts/test_*.py`
      # （20 个用例）曾长期全绿却**没有任何门会执行它们**（PR #182 修的正是「声明的判据
      # 代码从来没执行」这一族缺陷）。门里用发现规则（递归 `scripts/**/test_*.py`，
      # LUM-2602 把覆盖面从顶层扩到包内），新增测试文件漏接进门禁**结构上不可能**。
      # 依然只调 gates.sh，不在 yml 里写 `python3 scripts/test_*.py`（本仓纪律：命令唯一实现）。
      - name: "⑫ scripts-tests — python3 scripts/**/test_*.py（递归，含包内测试）"
        run: bash scripts/gates.sh --only scripts-tests

      # ⑬ 纯标准库、亚秒级、不需要数据库/编译：`docs/37` 号段台账的双向校验 + 撞号判据。
      # 存在的理由：号段一直是手工、先到先得、无校验的分配，撞号此前只在**合并时**以
      # `docs/37` 的 CONFLICT 暴露（PR #168 至今被它卡住）。同样只调 gates.sh，
      # 不在 yml 里写 `python3 scripts/section_alloc_check.py`（本仓纪律：命令唯一实现）。
      - name: "⑬ section-alloc — python3 scripts/section_alloc_check.py --quiet"
        run: bash scripts/gates.sh --only section-alloc

      # ⑭ 纯标准库、亚秒级、不需要数据库/编译：`ci.yml` / `gates.sh` 真正执行的每个
      # `scripts/**/<name>.py` 都必须有 `test_<name>.py`（**包入口取包名**：
      # `scripts/<pkg>/__main__.py` ⇒ `test_<pkg>.py`；**`python3 -m scripts.foo` 也算引用**）。
      # 存在的理由：`LUM-2606`/`2608`/`2617`/`2620`/`2621`/`2623`/`2624` 七个 cycle 都在给
      # 「被门执行的判定器」补测试，那一族靠**人记得补**收官（`docs/37 §292.2` / `§293.4`）。
      # 判词形状由 `LUM-2629` / `T1-6-R1` 修（`docs/37 §300`）。同样只调 gates.sh，
      # 不在 yml 里写 `python3 scripts/judge_test_coverage_check.py`（命令唯一实现）。
      - name: "⑭ judge-test-coverage — python3 scripts/judge_test_coverage_check.py --quiet"
        run: bash scripts/gates.sh --only judge-test-coverage

  # ⑥：真 PostgreSQL 16 service 容器；**先建表**再跑 DB e2e（测试自己不做迁移）。
  db:
    name: db — postgres:16 + DB e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
          POSTGRES_DB: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # gates.sh 的 db 门（缺这个变量会 exit 2，绝不静默跳过）。
      MULTICA_TEST_DATABASE_URL: postgres://multica:multica@127.0.0.1:5432/multica
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: "⑥ db — mc-migrate run + cargo test --features mc-http/test-util -- --ignored"
        run: bash scripts/gates.sh --only db

      # ⑧ 与 ⑥ 的语义分工：⑥ 回答「迁移能跑 + e2e 能过」，⑧ 回答「跑出来的 schema 还是不是上游那份」。
      # ⑧ 需要 `psql` 客户端（它对着上面的库 URL 建/删自己的 scratch 库 `schema_probe_w0b_drift_<PID>`），
      # 而 ⑥ 只用 Rust 侧的 sqlx；ubuntu-latest 镜像自带 psql，这里只是把「镜像是精简版」的情形补上，
      # 不足则装 —— 让 ⑧ 因为「没 psql」而红，会把环境问题错报成 schema 问题。
      - name: "⑧ deps — psql client + python3 for schema-drift"
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
          python3 --version

      - name: "⑧ schema drift — python3 scripts/schema_drift.py --quiet"
        run: bash scripts/gates.sh --only schema-drift

  # ⑦ + ⑨：契约门（route parity + conformance）。两者都是**离线确定性**门：
  # ⑦ 只读 `docs/fixtures/{upstream-routes.tsv,route-parity-baseline.json}`（纯 Python）；
  # ⑨ 跑 `mc-conformance --no-db --check`，打本仓真实 router 回放 58 条 golden fixture 并与
  # `crates/mc-conformance/report.json`（stateless 层快照）逐字节比对 —— **不需要数据库**，
  # 但要 Rust 工具链与一次 `cargo run`（缓存未命中时本 job 会有一次数分钟的编译，见 timeout）。
  # ⑨ 绝不能带库变量：带上它会追回 database 层、把合并报告拿去比 stateless 快照（见
  # `scripts/gates.sh` 顶部「已知坑」与 `docs/27-W0-GOLDEN-FIXTURES.md` §9）。
  contract:
    name: contract — route parity + conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ⑨ 需要 cargo（`cargo run -q -p mc-conformance -- --no-db --check …`）。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "⑦ route parity — python3 scripts/route_parity.py"
        run: bash scripts/gates.sh --only route-parity

      - name: "⑨ conformance — mc-conformance --no-db --check report.json"
        run: bash scripts/gates.sh --only conformance

  # ⑪ image（M10-7 / LUM-2109）：本仓**唯一**的发布制品 `deploy/Dockerfile`。
  #
  # 这个 job 存在的**全部理由**是：门 ⑪ 需要 docker，而开发机（实测 docker/podman/buildah
  # 三者皆无）跑不了它；门 ⑪ 因此刻意不在默认集合里（见 scripts/gates.sh 顶部「已知坑」⑪）。
  # 所以「镜像到底能不能建、非 root 有没有生效」在本仓**只有这里能判**。
  #
  # 🔴 唯一的 `run:` 就是 `bash scripts/gates.sh --only image` —— 本仓纪律：门禁命令的
  # 唯一实现是 gates.sh，CI 不重写命令（否则又是一次「CI 绿、本地红」式的两处漂移）。
  # ⚠️ 它**不装 rust toolchain**：⑪ 的编译发生在 `deploy/Dockerfile` 的 builder 阶段
  # （FROM rust:1-bookworm），runner 宿主不需要 Rust —— 装了也用不上，只会多花几分钟。
  image:
    name: image — deploy/Dockerfile（多阶段 / 非 root / ENTRYPOINT）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "⑪ image — docker build + 非 root + 二进制存在"
        run: bash scripts/gates.sh --only image
