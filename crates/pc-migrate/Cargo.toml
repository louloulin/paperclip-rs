[package]
name = "pc-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Paperclip database migration CLI"
publish = false

[[bin]]
name = "paperclip-migrate"
path = "src/main.rs"

[[bin]]
name = "lint"
path = "src/bin/lint.rs"

[[bin]]
name = "diff-report"
path = "src/bin/diff_report.rs"

[lints]
workspace = true

[dependencies]
pc-db = { path = "../pc-db" }
sqlx = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
name = "pc_migrate"
path = "src/lib.rs"
