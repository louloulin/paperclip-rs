[package]
name = "pc-plugin-state-store"
version = "0.1.0"
edition = "2021"
description = "Plugin scoped state store (get/set/delete/list with hook bus + capability check)"
license = "Apache-2.0"

[dependencies]
async-trait = { workspace = true }
chrono = "0.4"
pc-core = { path = "../pc-core" }
pc-repos = { path = "../pc-repos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
thiserror = "1"
tokio = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[lib]
path = "src/lib.rs"
