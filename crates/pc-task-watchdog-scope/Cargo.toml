[package]
name = "pc-task-watchdog-scope"
version = "0.1.0"
edition = "2021"
description = "Task watchdog mutation scope resolution (subtree ancestry + scope check)"
license = "Apache-2.0"

[dependencies]
async-trait = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { workspace = true }
uuid = { workspace = true }

[lib]
path = "src/lib.rs"
