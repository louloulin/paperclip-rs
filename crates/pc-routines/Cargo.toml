[package]
name = "pc-routines"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Routine business layer: get/list/create/update/trigger CRUD + lifecycle hooks"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
pc-core = { path = "../pc-core" }
pc-errors = { path = "../pc-errors" }
pc-repos = { path = "../pc-repos" }
pc-workflow = { path = "../pc-workflow" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }
sqlx = { workspace = true }
hmac = "0.12"
regex = { workspace = true }
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
pc-realtime = { path = "../pc-realtime" }
pc-errors = { path = "../pc-errors" }
async-trait = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
criterion = { workspace = true }

[[bench]]
name = "pure_bench"
harness = false