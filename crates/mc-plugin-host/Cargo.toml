[package]
name = "mc-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M6 anchor scaffold 占位 — plugin manifest/bundle 校验器与凭据派生（纯逻辑，不碰 HTTP、不碰库）"

[lints]
workspace = true

[features]
default = []

# M6-0 anchor（LUM-1665 / docs/57-M6-PLAN.md §5）：依赖一次声明到位，此后 M6 各切片
# **不得**再新增三方依赖（要加走 docs/15 §8.4 仲裁，由集成方加）。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
zip = { workspace = true }

mc-core = { path = "../mc-core" }
mc-errors = { path = "../mc-errors" }
# `mc-secrets::cipher` 是 base64 双字段形态（`{nonce, ciphertext}`），而
# `plugin_secret.ciphertext` 是 BYTEA 单块（上游 `secretbox` 的 `nonce‖ct‖tag`）
# ⇒ 本 crate 用 `aes-gcm` 直接实现 secretbox 同形；`mc-secrets` 的这条边留给根密钥
# （`ensure_root_key`）与将来可能的 store 复用，免得 M6-1 再动 manifest。
mc-secrets = { path = "../mc-secrets" }
