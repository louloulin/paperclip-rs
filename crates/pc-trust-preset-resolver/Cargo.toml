[package]
name = "pc-trust-preset-resolver"
version = "0.1.0"
edition = "2021"
description = "Trust preset resolution (agent/project/issue/run policy merge + boundary validation)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { workspace = true }

[dev-dependencies]
pc-repos = { path = "../pc-repos" }
sqlx = { workspace = true }
tokio = { workspace = true }

[lib]
path = "src/lib.rs"
