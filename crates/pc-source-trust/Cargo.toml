[package]
name = "pc-source-trust"
version = "0.1.0"
edition = "2021"
description = "Source trust metadata (low-trust quarantined / promoted) classification"
license = "Apache-2.0"

[dependencies]
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
pc-trust-preset-resolver = { path = "../pc-trust-preset-resolver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { workspace = true }
uuid = { workspace = true }

[lib]
path = "src/lib.rs"
