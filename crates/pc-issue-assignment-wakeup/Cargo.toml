[package]
name = "pc-issue-assignment-wakeup"
version = "0.1.0"
edition = "2021"
description = "Queue wakeup on issue assignment"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[lib]
path = "src/lib.rs"
