[package]
name = "pc-adapter-registry-bootstrap"
version = "0.1.0"
edition = "2021"
description = "Declarative adapter registry bootstrap (parse env + reconcile availability)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[lib]
path = "src/lib.rs"
