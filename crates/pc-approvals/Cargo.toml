[package]
name = "pc-approvals"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Approval business layer: state machine + hooks for hire/budget side effects"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
pc-adapter-api = { path = "../pc-adapter-api" }
chrono = { workspace = true }
pc-core = { path = "../pc-core" }
pc-errors = { path = "../pc-errors" }
pc-repos = { path = "../pc-repos" }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
futures-executor = "0.3"
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
