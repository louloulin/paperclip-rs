[package]
name = "pc-database-backup-health"
version = "0.1.0"
edition = "2021"
description = "Database backup health inspection (pure logic + injectable fs)"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lib]
path = "src/lib.rs"
