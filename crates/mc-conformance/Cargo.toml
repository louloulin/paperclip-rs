[package]
name = "mc-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "上游 golden fixture 的本地回放器：把 contracts/golden/** 打到本仓 axum router 上"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# `LUM-2591`：装置面要建「第二个成员」时必须能**指定** `"user"` 的主键
# （fixture 里那是逐字字面量，`UserRepo` 的两个建号面都不给这个口子，见
# `harness::seed_foreign_member` 的文档）。版本/特性与工作区其余 crate 逐字相同，
# 因此 Cargo.lock 只多一条依赖边。
sqlx = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }

mc-core = { path = "../mc-core" }
mc-cloud = { path = "../mc-cloud" }
mc-db = { path = "../mc-db" }
mc-feature-flags = { path = "../mc-feature-flags" }
mc-http = { path = "../mc-http" }
mc-realtime = { path = "../mc-realtime" }
mc-repos = { path = "../mc-repos" }
# `§297`：任务令牌装置要用 `TaskRepo::create_task` 建「主键由装置指定、
# `chat_session_id` 可空」的那一行任务（见 `task_token.rs` 模块头），
# 而 `NewTask::budget` 的类型来自 mc-task。纯路径依赖、零新增外部包。
mc-task = { path = "../mc-task" }
