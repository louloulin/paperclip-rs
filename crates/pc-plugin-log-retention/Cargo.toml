[package]
name = "pc-plugin-log-retention"
version = "0.1.0"
edition = "2021"
description = "Plugin log retention (prune + periodic sweep + hook bus)"
license = "Apache-2.0"

[dependencies]
async-trait = { workspace = true }
chrono = "0.4"
pc-repos = { path = "../pc-repos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
thiserror = "1"
tokio = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[lib]
path = "src/lib.rs"
