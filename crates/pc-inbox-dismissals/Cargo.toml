[package]
name = "pc-inbox-dismissals"
version = "0.1.0"
edition = "2021"
description = "Inbox dismissal pure helpers (kind normalization, snoozedUntil computation)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[lib]
path = "src/lib.rs"
