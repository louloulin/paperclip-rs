[package]
name = "pc-environment-redaction"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Redaction of environment custom-image values + templates + setup sessions (port of paperclip packages/shared/src/environment-custom-images.ts)"

[lints]
workspace = true

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "unicode-script"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
