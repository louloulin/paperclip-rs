[package]
name = "mc-autopilot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M5 anchor scaffold 占位 — autopilot 领域服务层（写面 / trigger / dispatch / webhook / wakeup），由 M5-1..M5-6 填充"

[lints]
workspace = true

[features]
default = []

# M5-0 anchor（LUM-1563 / docs/44-M5-PLAN.md §5.2）：依赖一次声明到位，此后 M5 各切片
# **不得**再新增三方依赖（要加走 docs/15 §8.4 的仲裁，由集成方加）。
# `cron` **不在**表里：§5.4 第 1 项的实测结论是手写 5 字段解析器，理由与实测数据见 src/lib.rs。
# `chrono-tz` 在这里而不在 mc-core：mc-core/Cargo.toml 不在 anchor 的写集里（同上 §3.1）。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

mc-core = { path = "../mc-core" }
mc-realtime = { path = "../mc-realtime" }
mc-repos = { path = "../mc-repos" }
mc-telemetry = { path = "../mc-telemetry" }
