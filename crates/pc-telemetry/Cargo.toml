[package]
name = "pc-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paperclip 遥测：tracing + 结构化日志 + 启动横幅 + 可选 OTLP/HTTP exporter + feedback trace 上传客户端"

[lints]
workspace = true

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# feedback trace 上传客户端依赖（gzip+base64+json）
flate2 = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# OTLP 依赖（feature-gated，避免对默认构建造成编译开销）
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
