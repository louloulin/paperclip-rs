[package]
name = "pc-issue-recovery-actions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Issue recovery action service — wraps pc-repos with DTO conversion, per-issue upsert serialization, and hooks"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
pc-core = { path = "../pc-core" }
pc-errors = { path = "../pc-errors" }
pc-repos = { path = "../pc-repos" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
pc-decision-bundle = { path = "../pc-decision-bundle" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
