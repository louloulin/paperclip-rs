[package]
name = "mc-repos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multica 仓储层（占位 — 后续 milestone 填充）"

[lints]
workspace = true

[features]
default = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

mc-core = { path = "../mc-core" }
mc-db = { path = "../mc-db" }
mc-errors = { path = "../mc-errors" }
mc-auth = { path = "../mc-auth" }
# M3-6 / W3b：task 领域层（状态机 / 租约 / 重试 / 取消 / usage）。
# 添加这条依赖会让 `Cargo.lock` 多出 `mc-repos → mc-task` 一条边（见 docs/41）。
mc-task = { path = "../mc-task" }

[dev-dependencies]
pretty_assertions = { workspace = true }