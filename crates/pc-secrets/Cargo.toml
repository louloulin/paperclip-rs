[package]
name = "pc-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Secret provider: local AES-256-GCM encryption, provider registry, health checks"

[lints]
workspace = true

[dependencies]
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"

base64 = "0.22"
hex = "0.4"
rand = "0.8"
dirs = { workspace = true }
