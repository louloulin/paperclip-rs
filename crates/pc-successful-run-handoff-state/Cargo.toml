[package]
name = "pc-successful-run-handoff-state"
version = "0.1.0"
edition = "2021"
description = "Successful run handoff state hydration + resolution on valid path"
license = "Apache-2.0"

[dependencies]
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }

[lib]
path = "src/lib.rs"
