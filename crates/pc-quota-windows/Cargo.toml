[package]
name = "pc-quota-windows"
version = "0.1.0"
edition = "2021"
description = "Fetch provider quota windows from all registered adapters"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[lib]
path = "src/lib.rs"
