[package]
name = "mc-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M3 anchor scaffold 占位 — daemon client + execenv，由 M3-7/M3-8 填充（ws 依赖已预声明）"

[lints]
workspace = true

[features]
default = []

# M3 anchor scaffold（LUM-1406 / docs/15-M3-PLAN.md §7.2.5）：依赖一次声明到位。
#
# `axum` 的 `ws` feature 与 `tokio-tungstenite` 是 docs/15 §7.2.5 点名要「先确认版本已
# 在 lock 中，否则由本片显式加入并说明」的两项 —— 实测**都已在 `Cargo.lock`**：
#   axum 0.7.9（workspace 依赖已开 `macros, ws`）、tokio-tungstenite 0.24.0
#   （workspace 依赖已开 `connect, rustls-tls-webpki-roots, url`）。
# 因此本片**不新增三方包**，只是把既有 workspace 依赖接到这个新 crate 上，
# M3-7 的 ws 服务端不必再动 `Cargo.toml` / `Cargo.lock`（docs/15 §7.5）。
# `futures-util` 给 ws 流的 Sink/Stream 组合（与 `mc-ws` 同款用法）。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# M3-7（LUM-1438）：daemon 客户端的 HTTP 腿（注册 / 心跳 / claim / 下线四条
# 真实出站调用）。`reqwest` 已是 workspace 依赖且已在 `Cargo.lock` 里
# （mc-http 用它跑 W1-Google 的出站调用），这里只是把它接到本 crate 上——
# **不新增任何包、不新增 feature、不加新版本**；锁文件的唯一变化是本 crate
# `dependencies` 数组里多一条 `reqwest`（实测 +1 行，无新 package 条目）。
# 预声明清单里没有它（docs/15 §7.2.5 当时只算了 ws 侧），登记为偏离 D-10。
reqwest = { workspace = true }

mc-core = { path = "../mc-core" }
mc-daemon-proto = { path = "../mc-daemon-proto" }
# M6-9（LUM-1674）两条 path 边。都不是新三方包：两个 crate 已在 workspace 里、
# 也已在根 `Cargo.lock` 的 package 表内 ⇒ 锁文件只多两条依赖记录，无新 package 条目。
#
# - `mc-skill`：本地 skill 发现要用**与 M6-2/3/4 同一套** frontmatter 解析与「疑似二进制」
#   判定（上游 daemon 同样调 `internal/skill`）—— 不这么接就得在 `mc-daemon` 里抄一份，
#   而那正是本波「一处真值」纪律要避免的。
# - `mc-mcp`：远端 MCP broker 消费 M6-1 的实现（`discover` / `validate_pinned_tools` /
#   `EndpointPolicy` / `secure_client`），本片不自建 JSON-RPC 客户端与摘要算法。
#
# ⚠️ 这两行**不在** 00:30 cycle 预飞时读到的「零 manifest 编辑」断言里（那条只覆盖 bundle
# hash 走 `mc-core` 这件事）—— 预飞没有把「broker 要消费 mc-mcp」这条动作清单条目对回
# manifest。偏离登记在 `docs/32` §9.9。
mc-mcp = { path = "../mc-mcp" }
mc-skill = { path = "../mc-skill" }
