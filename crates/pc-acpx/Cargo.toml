[package]
name = "pc-acpx"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paperclip ACPX engine — pure helpers (session codec, gemini version, usage summary, transcript parsing, normalize)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time", "sync"] }
uuid = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
once_cell = "1"
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "process", "time", "io-util", "net", "sync"] }
