[package]
name = "mc-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "M7 anchor scaffold 占位 — 渠道运行时（Channel trait / Registry / Capability / engine / 5 个平台 adapter）"

[lints]
workspace = true

[features]
default = []

# M7-0 anchor（`LUM-1765` / `docs/60-M7-PLAN.md` §2.2 / §5）：依赖边**一次接好**，
# 此后 M7 各切片**不得**再新增三方依赖（要加走 `docs/15` §8.4 仲裁，由集成方加）。
# 全部是 workspace 既有依赖 ⇒ `Cargo.lock` **只多一个成员 crate，无新外部包**。
#
# 依赖方向（无环，见 `docs/60` §2.2 的判据）：
#   mc-channel → mc-core / mc-repos / mc-realtime / mc-secrets / mc-telemetry / mc-task / mc-chat
#   mc-http → mc-channel（新增一条 path 边）
#   apps/mc-server → mc-channel（新增一条 path 边）
[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# 出站 HTTP（telegram `api.rs` / lark `http_client.rs` / 媒体下载上传）
reqwest = { workspace = true }
# 入站长连接（slack Socket Mode / lark WS / dingtalk Stream / wecom aibot）
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
# 凭据与验签（`secretbox` 的消费侧 / 卡片签名的 HMAC）
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

mc-core = { path = "../mc-core" }
mc-repos = { path = "../mc-repos" }
mc-realtime = { path = "../mc-realtime" }
# 部署密钥的封装盒（`mc_secrets::secretbox`，M7-0 落）。密钥的 **env 读取**不在本 crate：
# 唯一读取口是 `mc_http::state::ChannelKeys`。
mc-secrets = { path = "../mc-secrets" }
mc-telemetry = { path = "../mc-telemetry" }
mc-task = { path = "../mc-task" }
mc-chat = { path = "../mc-chat" }

[dev-dependencies]
pretty_assertions = { workspace = true }
