[package]
name = "pc-finance"
version = "0.1.0"
edition = "2021"
description = "Finance service facade (summary / byBiller / byKind / list / createEvent)"
license = "Apache-2.0"

[dependencies]
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
pc-core = { path = "../pc-core" }
pc-repos = { path = "../pc-repos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { workspace = true }
thiserror = "1"
tokio = { workspace = true }
tracing = "0.1"
uuid = { workspace = true }

[lib]
path = "src/lib.rs"
