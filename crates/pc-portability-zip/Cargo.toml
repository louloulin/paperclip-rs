[package]
name = "pc-portability-zip"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Company portability zip archive reader/writer with bomb guards and central-directory validation (port of paperclip packages/shared/src/portability-zip.ts)"

[lints]
workspace = true

[dependencies]
flate2 = "1"
crc32fast = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
