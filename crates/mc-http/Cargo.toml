[package]
name = "mc-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multica HTTP layer: axum router + middleware + state"

[lints]
workspace = true

[features]
default = []
test-util = ["mc-db/test-util"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
# W1-Google（LUM-1399）：`POST /auth/google` 的两个出站调用（token / userinfo）。
# 复用 workspace 既有版本（mc-cli 已在用），不引入新包。
reqwest = { workspace = true }

mc-core = { path = "../mc-core" }
mc-errors = { path = "../mc-errors" }
mc-config = { path = "../mc-config" }
# M3-2：运行时 adapter 注册表（`state.rs` 只 `pub use` 它；12 个调用点不用各自加依赖）。
mc-runtime = { path = "../mc-runtime" }
mc-auth = { path = "../mc-auth" }
mc-authz = { path = "../mc-authz" }
mc-realtime = { path = "../mc-realtime" }
mc-ws = { path = "../mc-ws" }
mc-storage = { path = "../mc-storage" }
mc-secrets = { path = "../mc-secrets" }
mc-feature-flags = { path = "../mc-feature-flags" }
mc-db = { path = "../mc-db" }
mc-repos = { path = "../mc-repos" }
# M4-3（LUM-1474）：chat 面的纯领域规则（标题校验/游标分页/置顶容量/草稿消费语义）。
# 本 crate 此前零依赖者；切片只新增这一条依赖边（非顶层 API 变更）。
mc-chat = { path = "../mc-chat" }
# M5-6（LUM-1565）：wakeup 服务面（`mc_autopilot::wakeup::service`）。本片只新增这一条依赖边；
# `Cargo.lock` 无需变更（`mc-autopilot` 已是 workspace 成员）。M5 后续切片共用同一条边。
# M5-1（LUM-1564）因同一原因也走这条边：`mc_autopilot::cron`（`GET /api/autopilots/cron-preview`
# 的唯一解析点）与 `mc_autopilot::quota`（`GET /api/autopilots/usage` 的 entitlement 面）。
# 方向无环：mc-autopilot 只依赖 mc-core / mc-realtime / mc-repos / mc-telemetry。
# 记录见 `docs/46-M5-1-READ-FACE.md`。
mc-autopilot = { path = "../mc-autopilot" }
mc-openapi = { path = "../mc-openapi" }
# M3-7（LUM-1438）：daemon 面需要
# - `mc-daemon-proto`：ws 帧 / RPC / 心跳 ack 的 wire 类型（LUM-1439 已交付）；
# - `mc-task`：task 状态机的**校验**入口（`TaskState::apply`），不重复建一套迁移规则。
mc-daemon-proto = { path = "../mc-daemon-proto" }
mc-task = { path = "../mc-task" }
# M4-2（LUM-1473）：squad 成员 presence 的纯推导（`derive_member_status` / 五桶分类）。
# 只走 domain 层，不碰 DB；放在 `mc-squad` 而不是 http 层是为了能单独做单元测试。
mc-squad = { path = "../mc-squad" }

[dev-dependencies]
pretty_assertions = { workspace = true }
# M1 sub-issue C 的 e2e 测试（tests/{invitations,pats}.rs）依赖以下三件套。
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
hyper = { workspace = true }
# M3-7：`GET /api/daemon/ws` 的真升级测试（握手 + 帧收发），不靠 mock。
tokio-tungstenite = { workspace = true }
# M3-7：WS 流的 `Sink::send` / `Stream::next`（与 mc-ws / mc-daemon 同款用法）。
futures-util = { workspace = true }

# 根目录 tests/smoke.rs 属于虚拟 workspace 根（无 [package]），默认不会被
# cargo 编译；这里把它声明为 mc-http 的集成测试 target，使其真正可跑。
[[test]]
name = "smoke"
path = "../../tests/smoke.rs"
