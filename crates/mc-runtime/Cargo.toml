[package]
name = "mc-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multica runtime: RuntimeAdapter/AdapterRegistry + pi-local 端到端（M3-2；其余 24 个 adapter 走 M3-8）"

[lints]
workspace = true

[features]
default = []

# M3 anchor scaffold（LUM-1406 / docs/15-M3-PLAN.md §7.2.5）预声明的依赖，M3-2 起全部
# 真正用上：`async-trait` 给 `RuntimeAdapter` trait、`tokio` 给 spawn + 逐行流式读取、
# `mc-core` 给 `RuntimeProfile`（`AgentType::runtime_profile()` 的 25↔26 对照）。
# 无新增三方包（§7.5），`Cargo.lock` 里只有 workspace 内路径边。
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

mc-core = { path = "../mc-core" }
