[workspace]
resolver = "2"
members = [
    "crates/pc-agent",
    "crates/pc-errors",
    "crates/pc-repos",
    "crates/pc-http",
    "crates/pc-migrate-smoke",
    "crates/pc-telemetry",
    "crates/pc-config",
    "crates/pc-core",
    "crates/pc-db",
    "crates/pc-auth",
    "crates/pc-authz",
    "crates/pc-realtime",
    "crates/pc-heartbeat",
    "crates/pc-acpx",
    "crates/pc-adapter-api",
    "crates/pc-adapter-process",
    "crates/pc-adapter-claude-local",
    "crates/pc-adapter-codex-local",
    "crates/pc-adapter-cursor-cloud",
    "crates/pc-adapter-cursor-local",
    "crates/pc-adapter-gemini-local",
    "crates/pc-adapter-grok-local",
    "crates/pc-adapter-hermes",
    "crates/pc-adapter-hermes-gateway",
    "crates/pc-adapter-openclaw-gateway",
    "crates/pc-adapter-opencode-local",
    "crates/pc-adapter-quota",
    "crates/pc-adapter-pi-local",
    "crates/pc-plugin-protocol",
    "crates/pc-plugin-host",
    "crates/pc-secrets",
    "crates/pc-decisions",
    "apps/pc-server",
    "apps/pc-cli",
    "crates/pc-storage",
    "crates/pc-dev-server-status",
    "crates/pc-plugin-ui-static",
    "crates/pc-workflow",
    "crates/pc-activity",
    "crates/pc-openapi",
    "crates/pc-feature-flags",
    "crates/pc-backup",
    "crates/pc-migrate",
    "crates/pc-cron",
    "crates/pc-approvals",
    "crates/pc-budgets",
    "crates/pc-companies",
    "crates/pc-portability",
    "crates/pc-issues",
    "crates/pc-pipelines",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Paperclip Contributors"]
repository = "https://github.com/paperclipai/paperclip-rs"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# HTTP / Web
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors", "limit", "fs"] }
hyper = "1"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }

# 序列化 / Schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 时间 / ID
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# 并发原语
dashmap = "6"
parking_lot = "0.12"

# 加密 / 哈希
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"

# 正则
regex = "1"

# JSON Schema 验证（插件 instance config 校验）
jsonschema = { version = "0.30", default-features = false }

# 错误 / 日志 / 配置
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
kameo = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dirs = "6"
dotenvy = "0.15"

# 测试
proptest = "1"
mockall = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
incremental = true
