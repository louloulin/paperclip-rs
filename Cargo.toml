[workspace]
resolver = "2"
# 用 glob 而不是逐个列成员：新增 crate 只加目录，不再需要动根 manifest
# （否则每个新 crate 的切片都要改这一行 → 全员冲突）。
# 约束：`crates/*`、`apps/*` 展开到的**每一个**目录都必须有 Cargo.toml，
# 否则 cargo 会在 `failed to load manifest for workspace member` 处直接失败。
# 另：`xtask` 目前不存在；不给不存在的字面路径当成员（cargo 会报错，实测 exit 101），
# 等到真的创建 `xtask/` 时再把它加进这个列表。详见 docs/28-WORKSPACE-REFACTOR.md。
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Multica Contributors"]
repository = "https://github.com/louloulin/multica-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# URL (mc-config)
url = { version = "2", features = ["serde"] }

# WebSocket
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }
futures-util = "0.3"

# HTTP / Web
# M6-0 anchor（docs/57-M6-PLAN.md §5）：`multipart` 是 M6-3/M6-5 的归档上传要用的
# body 抽取器，在此一次打开，免得后续切片再动这份 manifest。
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors", "limit", "fs"] }
# M6-7 的两档限流（`/v1` 面）。**版本停在 0.4**（不是最新的 0.8）：0.8 的 `axum`
# feature 拉的是 axum **0.8**（外加 tonic 0.14），会让 lock 里出现第二个 axum 大版本 ——
# `GovernorError → Response<Body>` 的 `From` 就落在别人的 `Body` 上，本仓的 axum 0.7
# `Router::layer` 直接编译不过（已实测）。0.4.3 依赖 axum 0.7 / tower 0.5 / http 1，与
# 本仓同代；且 0.4 没有 `tonic` 依赖。
tower_governor = { version = "0.4", default-features = false, features = ["axum"] }
hyper = "1"
http = "1"
http-body-util = "0.1"
bytes = "1"

# 注：这里曾经有一个 `tower04 = { package = "tower", version = "0.4", features = ["util"] }`
# 别名（给根 `tests/smoke.rs` 的 oneshot 用）。**已删除**：tower 0.4/0.5 共用同一个
# `tower-service 0.3.3`（`Service` trait 的提供者），axum 0.7.9 自身依赖的就是 tower 0.5.3，
# 所以 tower 0.5 的 `util::ServiceExt::oneshot` 一样能用 —— 见 docs/28-WORKSPACE-REFACTOR.md。

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }

# Serialization / Schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M6-2 的 SKILL.md frontmatter。⚠️ serde_yaml 已被上游归档（发布号带 `+deprecated` 后缀）；
# 本波沿用 docs/57 §2.5 的选型（已冻结可用），换维护中的 fork 属集成方仲裁事项。
serde_yaml = "0.9"

# Archive（M6-1 的 bundle 校验 / M6-3 的 skill 归档导入）。default-features 关掉：只要
# deflate，不要 bzip2 / lzma / zstd / zopfli / aes-crypto 那一串后端（它们的 C 依赖会拖慢冷构建，
# 而 skill / plugin 包都是我们自己的 deflate 包）。**版本停在 2**：zip 6 的 MSRV 是 1.83、
# zip 8 是 1.88，都高于本仓 `rust-version = 1.80`。
zip = { version = "2", default-features = false, features = ["deflate"] }

# Time / ID
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# Crypto / Hash
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
# M8-0 anchor（LUM-1797 / docs/61-M8-PLAN.md §2.4 R-M8-8）：GitHub App JWT 要 RS256
# （PKCS#1 v1.5）。本仓**没有** `jsonwebtoken`，但 `ring 0.17.14` 与 `rsa 0.9.10` 都
# **已在** `Cargo.lock` 里（传递依赖）⇒ 只新增这一条**直连边**，**零新外部包**。
# 选 `ring`（`RSA_PKCS1_SHA256` 更贴近上游 `golang-jwt` 的 PKCS#1 v1.5）。
ring = "0.17"

# Object storage / Secrets Manager —— optional，由 mc-storage/`s3`、mc-secrets/`aws` 打开。
# 注意：`optional` 不能写在 [workspace.dependencies] 里（cargo 报
# "workspace dependencies cannot be optional"），成员侧写 `{ workspace = true, optional = true }`。
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
aws-credential-types = "1"

# Regex / Random
regex = "1"
rand = "0.8"

# JSON Schema
schemars = { version = "0.8", default-features = false }

# Error / Logging / Config
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dirs = "6"
dotenvy = "0.15"

# Telemetry OTLP export —— optional，由 mc-telemetry/`otlp` feature 打开
opentelemetry = "0.24"
opentelemetry_sdk = "0.24"
opentelemetry-otlp = "0.17"
tracing-opentelemetry = "0.25"

# 性能 bench（M10-6 / `LUM-2108` / `docs/64` §2.5）。
# 🔴 版本**必须** `0.7`：`criterion` newest 是 `0.8.2`，其 `rust_version = 1.86` > 本仓
# `[workspace.package] rust-version = "1.80"`（实测 crates.io）；`0.7.0` 的 MSRV 恰好 `1.80`。
# 选库闸门（`plan1.md` §4：活跃维护 + >1M 月下载）实测通过：总下载 2.90 亿 /
# 近 90 天 5,968 万。**不要**在后续切片里顺手升到 0.8.x。
# 唯一消费者是 `crates/mc-bench`（dev-dependency）。
# 🔴 `async_tokio` 是**必须**的：三条热点的被测入口是 `async fn`，只有它能让
# `b.to_async(&runtime)` 直接 measure「future 完成」，而不是「`block_on` 套壳 + future 完成」。
# 该 feature 只引入 `tokio`（**已在**本表里），不改任何既有产物。
criterion = { version = "0.7", features = ["async_tokio"] }

# Test
proptest = "1"
mockall = "0.13"
pretty_assertions = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1