pc-heartbeat = { path = "../../crates/pc-heartbeat" }
pc-hot-restart = { path = "../../crates/pc-hot-restart" }
pc-repos = { path = "../../crates/pc-repos" }
pc-storage = { path = "../../crates/pc-storage" }
pc-secrets = { path = "../../crates/pc-secrets" }

pc-plugin-host = { path = "../../crates/pc-plugin-host" }
