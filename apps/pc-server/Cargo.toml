[package]
name = "pc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paperclip 服务器二进制入口"

[[bin]]
name = "paperclip-server"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
otlp = ["pc-telemetry/otlp"]

[dependencies]
